- id: e12
  difficulty: easy
  category: counting
  question: How many distinct facilities have had at least one admission?
  gold_sql: select count(distinct organization_id) from admissions

- id: e13
  difficulty: easy
  category: aggregation
  question: What is the total claim cost across all admissions, in dollars?
  gold_sql: select sum(total_claim_cost) from admissions

- id: e14
  difficulty: easy
  category: aggregation
  question: What is the median length of stay in days?
  gold_sql: select median(length_of_stay_days) from admissions

- id: e15
  difficulty: easy
  category: aggregation
  question: What is the longest length of stay, in days?
  gold_sql: select max(length_of_stay_days) from admissions

- id: e16
  difficulty: easy
  category: chronic
  question: How many patients have a diabetes diagnosis?
  gold_sql: select count(distinct patient_id) from condition_groups where chronic_group = 'Diabetes'

- id: m01
  difficulty: medium
  category: readmission
  question: What is the 30-day readmission rate for each age group, as a percentage?
  gold_sql: select age_group, 100 * avg(readmitted_30d::int) from readmissions_30d group by 1

- id: m02
  difficulty: medium
  category: grouping
  question: What are the 5 most common principal reasons for admission, with their admission counts?
  gold_sql: select principal_reason, count(*) n from admissions group by 1 order by n desc limit 5
  ordered: true

- id: m03
  difficulty: medium
  category: readmission
  question: What is the 30-day readmission rate for heart failure admissions, as a percentage?
  gold_sql: select 100 * avg(readmitted_30d::int) from readmissions_30d where principal_reason ilike '%heart failure%'

- id: m04
  difficulty: medium
  category: readmission
  question: What is the 30-day readmission rate for lung cancer admissions, as a percentage?
  gold_sql: select 100 * avg(readmitted_30d::int) from readmissions_30d where principal_reason ilike '%lung%'

- id: m05
  difficulty: medium
  category: grouping
  question: What is the average length of stay in days for each age group?
  gold_sql: select age_group, avg(length_of_stay_days) from admissions group by 1

- id: m06
  difficulty: medium
  category: join
  question: Which 5 facilities (by name) have the most admissions, and how many do they have?
  gold_sql: |
    select f.facility_name, count(*) n from admissions a
    join dim_facility f using (organization_id) group by 1 order by n desc limit 5
  ordered: true

- id: m07
  difficulty: medium
  category: join
  question: What is the 30-day readmission rate for male versus female patients, as a percentage?
  gold_sql: |
    select p.gender, 100 * avg(r.readmitted_30d::int) from readmissions_30d r
    join dim_patient p using (patient_id) group by 1

- id: m08
  difficulty: medium
  category: chronic
  question: What percentage of all patients have each chronic condition group (diabetes, hypertension, COPD, heart failure, chronic kidney disease, asthma)?
  gold_sql: |
    select chronic_group, 100.0 * count(distinct patient_id) / (select count(*) from dim_patient)
    from condition_groups where chronic_group is not null group by 1

- id: m09
  difficulty: medium
  category: join
  question: What percentage of male and female patients, respectively, have a hypertension diagnosis?
  gold_sql: |
    select p.gender, 100.0 * count(distinct c.patient_id) / count(distinct p.patient_id)
    from dim_patient p left join condition_groups c
      on c.patient_id = p.patient_id and c.chronic_group = 'Hypertension'
    group by 1

- id: m10
  difficulty: medium
  category: grouping
  question: What is the average claim cost per admission for each age group, in dollars?
  gold_sql: select age_group, avg(total_claim_cost) from admissions group by 1

- id: m11
  difficulty: medium
  category: time
  question: How many admissions were there in each calendar year from 2021 through 2025?
  gold_sql: |
    select extract(year from admit_ts)::int y, count(*) from admissions
    where extract(year from admit_ts) between 2021 and 2025 group by 1

- id: m12
  difficulty: medium
  category: time
  question: What was the 30-day readmission rate for admissions that started in 2025, as a percentage?
  gold_sql: select 100 * avg(readmitted_30d::int) from readmissions_30d where extract(year from admit_ts) = 2025

- id: m13
  difficulty: medium
  category: readmission
  question: Among admissions that were readmitted within 30 days, what percentage were readmitted within 7 days of discharge?
  gold_sql: |
    select 100.0 * sum((days_to_next_admit <= 7)::int) / count(*) from readmissions_30d where readmitted_30d

- id: m14
  difficulty: medium
  category: readmission
  question: For admissions that were readmitted within 30 days, what was the average number of days between discharge and the next admission?
  gold_sql: select avg(days_to_next_admit) from readmissions_30d where readmitted_30d

- id: m15
  difficulty: medium
  category: counting
  question: How many patients have been admitted two or more times?
  gold_sql: select count(*) from (select patient_id from admissions group by 1 having count(*) >= 2)

- id: m16
  difficulty: medium
  category: join
  question: Among facilities with at least 50 index admissions in the readmission measure, which facility (by name) has the highest 30-day readmission rate, and what is it as a percentage?
  gold_sql: |
    select f.facility_name, 100 * avg(r.readmitted_30d::int) rate from readmissions_30d r
    join dim_facility f using (organization_id) group by 1 having count(*) >= 50
    order by rate desc limit 1
  ordered: true

- id: m17
  difficulty: medium
  category: grouping
  question: Among principal reasons with at least 50 admissions, which one has the highest average claim cost, and what is that average in dollars?
  gold_sql: |
    select principal_reason, avg(total_claim_cost) c from admissions group by 1
    having count(*) >= 50 order by c desc limit 1
  ordered: true

- id: m18
  difficulty: medium
  category: counting
  question: How many admissions ended with the patient dying during the stay?
  gold_sql: select count(*) from admissions where died_during_stay

- id: m19
  difficulty: medium
  category: chronic
  question: How many admissions were by patients who have a diabetes diagnosis?
  gold_sql: |
    select count(*) from admissions
    where patient_id in (select patient_id from condition_groups where chronic_group = 'Diabetes')

- id: h01
  ignore_cols: [0]   # label column; values must match, labels may be phrased differently
  difficulty: hard
  category: chronic
  question: Compare the 30-day readmission rate, as a percentage, for patients with a diabetes diagnosis versus patients without one.
  gold_sql: |
    select r.patient_id in (select patient_id from condition_groups where chronic_group = 'Diabetes') as has_diabetes,
           100 * avg(r.readmitted_30d::int)
    from readmissions_30d r group by 1

- id: h02
  difficulty: hard
  category: readmission
  question: For each age group, give the number of index admissions and the 30-day readmission rate as a percentage.
  gold_sql: |
    select age_group, count(*) n, 100 * avg(readmitted_30d::int) from readmissions_30d group by 1

- id: h03
  difficulty: hard
  category: chronic
  question: Of the patients diagnosed with heart failure (chronic condition group), what percentage have had at least one inpatient admission?
  gold_sql: |
    select 100.0 * count(distinct a.patient_id) / count(distinct c.patient_id)
    from condition_groups c left join admissions a on a.patient_id = c.patient_id
    where c.chronic_group = 'Heart failure'

- id: h04
  ignore_cols: [0]   # label column; values must match, labels may be phrased differently
  difficulty: hard
  category: time
  question: What was the 30-day readmission rate in each quarter of 2025 (by admission date), as a percentage?
  gold_sql: |
    select extract(quarter from admit_ts)::int q, 100 * avg(readmitted_30d::int)
    from readmissions_30d where extract(year from admit_ts) = 2025 group by 1

- id: h05
  difficulty: hard
  category: time
  question: What was the 30-day readmission rate, as a percentage, in the most recent full calendar quarter before the latest admission in the data?
  gold_sql: |
    select 100 * avg(readmitted_30d::int) from readmissions_30d
    where admit_ts >= date_trunc('quarter', (select max(admit_ts) from admissions)) - interval '3 months'
      and admit_ts <  date_trunc('quarter', (select max(admit_ts) from admissions))

- id: h06
  difficulty: hard
  category: readmission
  question: Among principal reasons with at least 100 index admissions, which 3 have the highest 30-day readmission rate? Give the rate as a percentage.
  gold_sql: |
    select principal_reason, 100 * avg(readmitted_30d::int) rate from readmissions_30d
    group by 1 having count(*) >= 100 order by rate desc limit 3
  ordered: true

- id: h07
  ignore_cols: [0]   # label column; values must match, labels may be phrased differently
  difficulty: hard
  category: readmission
  question: Compare the average length of stay in days for admissions that were readmitted within 30 days versus those that were not.
  gold_sql: select readmitted_30d, avg(length_of_stay_days) from readmissions_30d group by 1

- id: h08
  ignore_cols: [0]   # label column; values must match, labels may be phrased differently
  difficulty: hard
  category: readmission
  question: What is the 30-day readmission rate, as a percentage, for stays of 0-3 days, 4-7 days, and 8 or more days?
  gold_sql: |
    select case when length_of_stay_days <= 3 then '0-3' when length_of_stay_days <= 7 then '4-7' else '8+' end b,
           100 * avg(readmitted_30d::int)
    from readmissions_30d group by 1

- id: h09
  difficulty: hard
  category: readmission
  question: Among facilities with at least 30 index admissions, how many have a 30-day readmission rate above the overall rate?
  gold_sql: |
    with f as (select organization_id, avg(readmitted_30d::int) r from readmissions_30d
               group by 1 having count(*) >= 30)
    select count(*) from f where r > (select avg(readmitted_30d::int) from readmissions_30d)

- id: h10
  difficulty: hard
  category: readmission
  question: What percentage of all 30-day readmissions followed an index admission for lung cancer?
  gold_sql: |
    select 100.0 * sum((readmitted_30d and principal_reason ilike '%lung%')::int) / sum(readmitted_30d::int)
    from readmissions_30d

